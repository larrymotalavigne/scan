version: '3.9'

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-scan}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: back/Dockerfile
    volumes:
      - ./back:/app/back
      - ./pyproject.toml:/app/pyproject.toml
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@database:5432/${DB_NAME:-scan}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-development-secret-key-change-in-production}
      DEBUG: "true"
      CORS_ORIGINS: '["http://localhost:4200","http://localhost"]'
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend
    command: uvicorn back.api.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    volumes:
      - ./front/src:/app/src
      - ./front/angular.json:/app/angular.json
      - ./front/tsconfig.json:/app/tsconfig.json
      - ./front/package.json:/app/package.json
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - api
    networks:
      - frontend
    environment:
      - NODE_ENV=development

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
  frontend:
